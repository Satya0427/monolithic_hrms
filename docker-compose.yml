services:

  # ──────────────────────────────────────────────
  # MongoDB  +  Auto-Restore on first run
  # ──────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: hrms_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: recruitment-hrms
    ports:
      - "2301:27017"
    volumes:
      # Persistent data storage
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      # ─────────────────────────────────────────────────────────────────
      # Auto-restore: MongoDB official image runs every *.sh file inside
      # /docker-entrypoint-initdb.d/ ONLY on the very first startup
      # (when mongo_data volume is empty / freshly created).
      # On subsequent restarts the volume already has data, so these
      # scripts are NEVER executed again — your live data stays intact.
      # ─────────────────────────────────────────────────────────────────
      - ./mongo-init/mongo-restore.sh:/docker-entrypoint-initdb.d/mongo-restore.sh:ro
      - ./mongodb_dump:/mongodb_dump:ro
    networks:
      - hrms_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ──────────────────────────────────────────────
  # Redis
  # ──────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: hrms_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --loglevel warning
    ports:
      - "2401:6379"
    volumes:
      - redis_data:/data
    networks:
      - hrms_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ──────────────────────────────────────────────
  # Node.js Backend API
  # ──────────────────────────────────────────────
  backend:
    build:
      context: ./node_template
      dockerfile: Dockerfile
    container_name: hrms_backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # ── Server ──
      PORT: 4000
      NODE_ENV: production

      # ── MongoDB ──
      # Uses the Docker service name "mongodb" as host (not localhost)
      MONGO_URI: mongodb://mongodb:27017/recruitment-hrms

      # ── Redis ──
      # Uses the Docker service name "redis" as host (not localhost / 127.0.0.1)
      REDIS_URL: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: ""
      REDIS_PASSWORD: ""

      # ── CORS ──
      ALLOWED_DOMINES: '["http://localhost:2101","http://localhost:8080","http://localhost:80","http://localhost:4200","http://frontend"]'

      # ── Token secrets (CHANGE THESE in production!) ──
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-Satya@0427}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-Satya@1234}
      ACCESS_TOKEN_EXPIRES: ${ACCESS_TOKEN_EXPIRES:-30m}
      REFRESH_TOKEN_EXPIRES_SEC: ${REFRESH_TOKEN_EXPIRES_SEC:-2592000}
      SALT_ROUND: ${SALT_ROUND:-10}

      # ── ImageKit ──
      IMAGEKIT_PUBLIC_KEY: ${IMAGEKIT_PUBLIC_KEY:-public_Oo7AmdsNAR3ib3zQvLu0DYuMZrU=}
      IMAGEKIT_PRIVATE_KEY: ${IMAGEKIT_PRIVATE_KEY:-private_ohtIPrTHBmT9UqjLqoqNPLBPbgI=}
      IMAGEKIT_URLENDPOINT: ${IMAGEKIT_URLENDPOINT:-https://ik.imagekit.io/sfmijw3gk}

      JWT_SECRET: ${JWT_SECRET:-}
    ports:
      - "2201:4000"
    volumes:
      - backend_logs:/app/logs
    networks:
      - hrms_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ──────────────────────────────────────────────
  # Angular Frontend (served by Nginx)
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: ./hrms-shell
      dockerfile: Dockerfile
    container_name: hrms_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "2101:80"
    networks:
      - hrms_network

# ──────────────────────────────────────────────
# Named Volumes  (data survives container restarts)
# ──────────────────────────────────────────────
volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local

# ──────────────────────────────────────────────
# Shared Network
# ──────────────────────────────────────────────
networks:
  hrms_network:
    driver: bridge

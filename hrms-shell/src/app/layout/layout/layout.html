<div class="main-container">

    <!-- Sidenav Wrapper -->

    </aside>

    <!-- Main Content Area -->
    <main class="content-area">
        <app-header></app-header>
        <!-- Page Content Glass Card -->
        <div class="page-content">
            <router-outlet></router-outlet>
        </div>
    </main>

</div>

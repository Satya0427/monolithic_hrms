<div class="page-container">

    <!-- Header -->
    <div class="page-header">
        <div>
            <h1>{{ plan.plan_name }} Plan</h1>

            <div class="meta-row">
                <span class="code">Code: {{ plan.plan_code }}</span>

                <span class="status-chip" [ngClass]="plan.status.toLowerCase()">
                    {{ plan.status }}
                </span>
            </div>
        </div>

        <!-- Back button (required) -->
        <button mat-stroked-button class="back-btn" routerLink="/home/paltform-management/subscription-plan/subscription-plan-list">
            Back
        </button>
    </div>

    <div class="content-grid">

        <!-- LEFT -->
        <div>
            <mat-card class="card">
                <h3>Pricing</h3>

                <div class="info-grid">
                    <div>
                        <label>Monthly</label>
                        <p>₹{{ plan.monthlyPrice }}</p>
                    </div>

                    <div>
                        <label>Yearly</label>
                        <p>₹{{ plan.yearlyPrice }}</p>
                    </div>
                </div>
            </mat-card>

            <mat-card class="card">
                <h3>Limits</h3>

                <div class="info-grid">
                    <div>
                        <label>Employees</label>
                        <p>{{ plan.employeeLimit }}</p>
                    </div>

                    <div>
                        <label>Storage</label>
                        <p>{{ plan.storageLimit }} GB</p>
                    </div>
                </div>
            </mat-card>
        </div>

        <!-- RIGHT -->
        <div>
            <mat-card class="card">
                <h3>Enabled Modules</h3>

                <div class="module-list">
                    <span class="module-chip" *ngIf="plan.modules.recruitment">
                        Recruitment
                    </span>

                    <span class="module-chip" *ngIf="plan.modules.onboarding">
                        Onboarding
                    </span>

                    <span class="module-chip" *ngIf="plan.modules.payroll">
                        Payroll
                    </span>

                    <span class="module-chip" *ngIf="plan.modules.performance">
                        Performance
                    </span>

                    <span class="module-chip" *ngIf="plan.modules.learning">
                        Learning
                    </span>
                </div>
            </mat-card>

            <mat-card class="card">
                <h3>Actions</h3>

                <button mat-stroked-button [routerLink]="['/home/paltform-management/subscription-plan/subscription-plan-edit', planId]">
                    Edit Plan
                </button>

                <button mat-stroked-button color="warn">
                    {{ plan.status === 'Active'
                    ? 'Deactivate Plan'
                    : 'Activate Plan' }}
                </button>
            </mat-card>
        </div>

    </div>

</div>

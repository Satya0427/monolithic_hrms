<div class="page-container">

    <!-- Header -->
    <div class="page-header">
        <div>
            <h1>Global Admin Users</h1>
            <p class="page-subtitle">
                Manage organization owners and primary administrators
            </p>
        </div>

        <button mat-flat-button color="primary" routerLink="/home/paltform-management/global-admin/global-admin-create">
            <mat-icon>add</mat-icon>
            Create Global Admin
        </button>
    </div>

    <!-- Table -->
    <div class="table-container mat-elevation-z1">
        <table mat-table [dataSource]="globalAdmins">

            <!-- Name -->
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef> Name </th>
                <td mat-cell *matCellDef="let admin">
                    <strong>{{ admin.name }}</strong>
                </td>
            </ng-container>

            <!-- Email -->
            <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef> Email </th>
                <td mat-cell *matCellDef="let admin">
                    {{ admin.email }}
                </td>
            </ng-container>

            <!-- Organization -->
            <ng-container matColumnDef="organization">
                <th mat-header-cell *matHeaderCellDef> Organization </th>
                <td mat-cell *matCellDef="let admin">
                    {{ admin.organization }}
                </td>
            </ng-container>

            <!-- Status -->
            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef> Status </th>
                <td mat-cell *matCellDef="let admin">
                    <span class="status-chip" [ngClass]="admin.status.toLowerCase()">
                        {{ admin.status }}
                    </span>
                </td>
            </ng-container>

            <!-- Created -->
            <ng-container matColumnDef="created">
                <th mat-header-cell *matHeaderCellDef> Created On </th>
                <td mat-cell *matCellDef="let admin">
                    {{ admin.created | date:'dd MMM yyyy' }}
                </td>
            </ng-container>

            <!-- Actions -->
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef> Actions </th>
                <td mat-cell *matCellDef="let admin">

                    <button mat-icon-button [routerLink]="['/home/paltform-management/global-admin/global-admin-view',admin.id]">
                        <mat-icon>visibility</mat-icon>
                    </button>

                    <button mat-icon-button
                        [routerLink]="['/home/paltform-management/global-admin/global-admin-edit',admin.id]">
                        <mat-icon>edit</mat-icon>
                    </button>

                    <button mat-icon-button (click)="openStatusDialog(admin)">
                        <mat-icon>
                            {{ admin.status === 'Active'
                            ? 'pause_circle'
                            : 'play_circle' }}
                        </mat-icon>
                    </button>


                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        </table>
    </div>

</div>

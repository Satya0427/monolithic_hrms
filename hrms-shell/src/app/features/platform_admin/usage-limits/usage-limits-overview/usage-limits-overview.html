<div class="page-container">

    <!-- Header -->
    <div class="page-header">
        <div>
            <h1>Usage & Limits</h1>
            <p class="subtitle">
                Monitor organization usage against subscription limits
            </p>
        </div>
    </div>

    <mat-card class="table-card">

        <table mat-table [dataSource]="data">

            <!-- Organization -->
            <ng-container matColumnDef="organization">
                <th mat-header-cell *matHeaderCellDef> Organization </th>
                <td mat-cell *matCellDef="let row">
                    <strong>{{ row.org }}</strong>
                </td>
            </ng-container>

            <!-- Plan -->
            <ng-container matColumnDef="plan">
                <th mat-header-cell *matHeaderCellDef> Plan </th>
                <td mat-cell *matCellDef="let row">
                    {{ row.plan }}
                </td>
            </ng-container>

            <!-- Employees -->
            <ng-container matColumnDef="employees">
                <th mat-header-cell *matHeaderCellDef> Employees </th>
                <td mat-cell *matCellDef="let row">
                    {{ row.employeesUsed }} / {{ row.employeesLimit }}
                    <mat-progress-bar mode="determinate" [value]="(row.employeesUsed / row.employeesLimit) * 100">
                    </mat-progress-bar>
                </td>
            </ng-container>

            <!-- Storage -->
            <ng-container matColumnDef="storage">
                <th mat-header-cell *matHeaderCellDef> Storage (GB) </th>
                <td mat-cell *matCellDef="let row">
                    {{ row.storageUsed }} / {{ row.storageLimit }}
                    <mat-progress-bar mode="determinate" [value]="(row.storageUsed / row.storageLimit) * 100">
                    </mat-progress-bar>
                </td>
            </ng-container>

            <!-- Modules -->
            <ng-container matColumnDef="modules">
                <th mat-header-cell *matHeaderCellDef> Module Usage </th>
                <td mat-cell *matCellDef="let row">
                    {{ row.moduleUsage }}%
                </td>
            </ng-container>

            <!-- Status -->
            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef> Status </th>
                <td mat-cell *matCellDef="let row">
                    <app-usage-alert-chip [status]="row.status"></app-usage-alert-chip>
                </td>
            </ng-container>

            <!-- Actions -->
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef> </th>
                <td mat-cell *matCellDef="let row">
                    <button mat-stroked-button routerLink="../usage-limit-org-details">
                        View Details
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        </table>

    </mat-card>

</div>

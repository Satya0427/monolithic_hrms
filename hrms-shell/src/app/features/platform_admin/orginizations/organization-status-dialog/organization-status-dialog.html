<h2 mat-dialog-title>
  {{ data.status === 'suspend'
      ? 'Suspend Organization'
      : 'Activate Organization' }}
</h2>

<mat-dialog-content>

  <p class="description">
    Are you sure you want to
    <strong>{{ data.status }}</strong>
    <strong>{{ data.orgName }}</strong>?
  </p>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Reason</mat-label>
    <textarea
      matInput
      rows="3"
      placeholder="Provide a reason for this action"
      [(ngModel)]="reason">
    </textarea>
  </mat-form-field>

  <mat-hint *ngIf="data.status === 'suspend'">
    Users will not be able to access the application.
  </mat-hint>

</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="cancel()">
    Cancel
  </button>

  <button
    mat-flat-button
    [color]="data.status === 'suspend' ? 'warn' : 'primary'"
    [disabled]="!reason"
    (click)="confirm()">
    Confirm
  </button>
</mat-dialog-actions>
